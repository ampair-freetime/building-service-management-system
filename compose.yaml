services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-building_service}
      POSTGRES_USER: ${POSTGRES_USER:-building_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-building_service}
    expose:
      - "5432"
    ports:
      - 127.0.0.1:5434:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./Backend
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      BSMS_ENV_FILE: ""
      BACKEND_CORS_ORIGINS: '${BACKEND_CORS_ORIGINS:-["http://localhost:5173"]}'
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-building_service}:${POSTGRES_PASSWORD:-building_service}@database:5432/${POSTGRES_DB:-building_service}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-only-change-this-secret}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_STARTTLS: ${SMTP_USE_STARTTLS:-false}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      MAIL_FROM: ${MAIL_FROM:-Building Care <no-reply@example.com>}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      STAFF_ACTIVATION_URL: ${STAFF_ACTIVATION_URL:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-building-service-images}
      R2_PRESIGNED_URL_EXPIRE_SECONDS: ${R2_PRESIGNED_URL_EXPIRE_SECONDS:-900}
      R2_CONNECT_TIMEOUT_SECONDS: ${R2_CONNECT_TIMEOUT_SECONDS:-5}
      R2_READ_TIMEOUT_SECONDS: ${R2_READ_TIMEOUT_SECONDS:-15}
      R2_TOTAL_MAX_ATTEMPTS: ${R2_TOTAL_MAX_ATTEMPTS:-2}
      MAX_IMAGE_UPLOAD_BYTES: ${MAX_IMAGE_UPLOAD_BYTES:-5242880}
      MAX_GUEST_IMAGES: ${MAX_GUEST_IMAGES:-5}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-8000000}
      MAX_IMAGE_PROCESSING_CONCURRENCY: ${MAX_IMAGE_PROCESSING_CONCURRENCY:-1}
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
    depends_on:
      database:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  frontend:
    build:
      context: ./Frontend
      target: development
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  frontend_node_modules:
  postgres_data:
