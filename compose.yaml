services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-building_service}
      POSTGRES_USER: ${POSTGRES_USER:-building_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-building_service}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./Backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      BACKEND_CORS_ORIGINS: '["http://localhost:5173"]'
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-building_service}:${POSTGRES_PASSWORD:-building_service}@database:5432/${POSTGRES_DB:-building_service}
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./Frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  frontend_node_modules:
  postgres_data:
