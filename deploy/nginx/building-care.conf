# Host Nginx in front of the Docker stack. Replace care.example.ac.th with the real
# domain, then run `sudo certbot --nginx -d <domain>`: certbot adds the HTTPS
# server block and the HTTP -> HTTPS redirect to this file.

server {
    listen 80;
    listen [::]:80;
    server_name care.example.ac.th;

    # Must match the frontend container (Frontend/nginx.conf), otherwise uploads fail with 413.
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: a client-supplied X-Forwarded-For would let anyone
        # pick the IP used by login/reset rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
