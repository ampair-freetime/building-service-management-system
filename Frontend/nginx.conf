# Rendered at container start by the nginx image's envsubst step (only variables that
# exist in the environment are replaced, so $host etc. stay as nginx variables).
# TRUSTED_PROXY_CIDR = the one hop allowed to talk to this container, chosen by
# compose.production.yaml:
#   README "ทาง A": APP_SUBNET (host Nginx arrives through the Docker network gateway)
#   README "ทาง B": EDGE_PROXY_CIDR only (the organisation's reverse proxy). APP_SUBNET
#     must NOT be trusted then: docker-proxy forwards host-local and other-container
#     traffic from that gateway, which would let anyone skip the proxy and fake X-Forwarded-For.

# Docker's embedded DNS. Re-resolve "backend" every 10s so a recreated backend container
# (new IP) is picked up without restarting this container; otherwise /api returns 502.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream backend_up {
    zone backend_up 64k;
    server backend:8000 resolve;
}

# The host Nginx terminates TLS and sends X-Forwarded-Proto: https. Pass that on so
# backend redirects keep https; fall back to this hop's scheme when it is absent.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Who may talk to this container directly. $realip_remote_addr is the TCP peer before
# real_ip replaces $remote_addr with the client IP, so a plain allow/deny would wrongly
# check the end user instead of the proxy. Port 8080 may be published on a LAN address,
# and Docker bypasses the host firewall, so the check has to live here.
geo $realip_remote_addr $from_trusted_hop {
    default               0;
    127.0.0.0/8           1;  # container healthcheck (loopback)
    ${TRUSTED_PROXY_CIDR} 1;  # host Nginx or organisation proxy, see above
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Five 10 MiB images (MAX_IMAGE_UPLOAD_BYTES) plus multipart fields.
    # Keep in sync with deploy/nginx/building-care.conf.
    client_max_body_size 60m;

    if ($from_trusted_hop = 0) {
        return 403;
    }

    # Real client IP: trust X-Forwarded-For only from the hops above, so nobody else can
    # fake it (login rate limits count per client IP).
    set_real_ip_from ${TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location /api/ {
        # No trailing slash: preserve /api/v1/... in the backend request.
        proxy_pass http://backend_up;
        # $http_host keeps the port (if any) so backend redirects point at the same origin.
        proxy_set_header Host $http_host;
        # Overwrite with the resolved client IP instead of appending a client-supplied list.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Uptime monitors must reach the backend; without this the SPA fallback below
    # would answer 200 with index.html even when the backend is down.
    location = /health {
        proxy_pass http://backend_up/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
