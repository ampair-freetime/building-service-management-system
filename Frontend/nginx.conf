# Rendered at container start by the nginx image's envsubst step (only variables that
# exist in the environment are replaced, so $host etc. stay as nginx variables).
# TRUSTED_PROXY_CIDR = the Docker "app" network from compose.production.yaml (APP_SUBNET).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Five 10 MiB images (MAX_IMAGE_UPLOAD_BYTES) plus multipart fields.
    # Keep in sync with deploy/nginx/building-care.conf.
    client_max_body_size 60m;

    # Real client IP: the host Nginx reaches this container through the Docker network
    # gateway, so trust X-Forwarded-For only from that network. Anyone else cannot fake it.
    set_real_ip_from ${TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location /api/ {
        # No trailing slash: preserve /api/v1/... in the backend request.
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Overwrite with the resolved client IP instead of appending a client-supplied list.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Uptime monitors must reach the backend; without this the SPA fallback below
    # would answer 200 with index.html even when the backend is down.
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
